<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTÜ Akıllı Kampüs Ligi</title>
    <style>
        body { background-color: #1a1a2e; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        h1 { color: #00d2ff; text-shadow: 0 0 10px #00d2ff; margin-bottom: 5px; font-size: 2em; }
        h4 { color: #8892b0; margin-top: 0; font-size: 1.2em; }
        .gun-etiket { color: #00d2ff; font-weight: bold; background: #0f3460; padding: 5px 15px; border-radius: 20px;}
        
        #alarmKutusu { display: none; background: #e94560; color: white; padding: 20px; font-size: 1.4em; font-weight: bold; border-radius: 10px; margin: 20px 0; animation: flash 1s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        .status-box { font-size: 1.2em; margin: 20px 0; padding: 20px; background: #0f3460; border-radius: 10px; border: 1px solid #1f4287; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        
        .card { background: #1a1a2e; padding: 20px; border-radius: 10px; border: 1px solid #1f4287; transition: 0.3s; position: relative; }
        /* Aktif Konum Çerçevesi (Mavi Kesik Çizgi) */
        .aktif-bina { border: 2px dashed #00d2ff !important; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
        /* Lig Lideri Çerçevesi (Sarı Düz Çizgi) */
        .lig-lider { border-color: #ffd700 !important; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5) !important; border-style: solid !important; }
        
        .lig-rozet { position: absolute; top: -15px; right: -15px; background: #ffd700; color: #000; padding: 5px 10px; border-radius: 50%; font-weight: bold; font-size: 1.2em; display: none; }
        .aktif-rozet { color: #00d2ff; font-size: 0.9em; font-weight: bold; margin-bottom: 5px; }
        
        .btn-group { margin-top: 30px; display: flex; justify-content: center; gap: 20px; }
        .btn { background: #00d2ff; color: #000; border: none; padding: 15px 30px; font-size: 1.1em; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #0099cc; box-shadow: 0 0 15px #00d2ff; }
        .btn-sim { background: #e94560; color: #fff; }
        
        #raporAlani { margin-top: 35px; padding: 25px; background: #0f3460; border-radius: 10px; display: none; text-align: left; }
        .metafor-text { color: #00d2ff; font-size: 1.2em; margin-top: 15px; line-height: 1.6; }
        .tasarruf-vurgu { font-size: 1.3em; font-weight: bold; color: #ffd700; }
        .standart-not { font-size: 0.85em; color: #8892b0; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 FAKÜLTE CANLI TASARRUF LİGİ</h1>
        <h4>Sürdürülebilir Kampüs IoT Sistemi - <span class="gun-etiket">AKTİF GÜN: <span id="gunSpan">1</span></span></h4>
        <div class="standart-not">* Tasarruf verileri YALNIZCA "Sabunlama Aralığında Suyun Kesilmesi" durumuna göre saniye bazlı hesaplanmaktadır.</div>
        
        <div id="alarmKutusu">⚠️ DİKKAT: <span id="alarmKonum"></span> Su Sızıntısı Algılandı! Solenoid Valfler KAPATILDI!</div>

        <div class="status-box" id="aktifDurum">Sensör Verisi Bekleniyor...</div>

        <div class="grid" id="binaGrid"></div>

        <div class="btn-group">
            <button class="btn" onclick="gunuBitir()">📅 Günü Bitir & Ligi Güncelle</button>
            <button class="btn btn-sim" onclick="gecmisiGoster()">📜 Geçmiş Raporlar & Çevresel Etki</button>
        </div>

        <div id="raporAlani"></div>
    </div>

    <script>
        let gecmisVeriler = {};
        
        const DEBI_KLASIK = 0.138; 
        const DEBI_AKILLI = 0.031; 
        const ELK_SN = 0.002;      

        function veriCek() {
            fetch('/api/durum')
                .then(response => response.json())
                .then(data => {
                    gecmisVeriler = data.gecmis;
                    document.getElementById('gunSpan').innerText = data.gun;
                    
                    let alarmKutusu = document.getElementById('alarmKutusu');
                    if(data.alarm) {
                        alarmKutusu.style.display = 'block';
                        document.getElementById('alarmKonum').innerText = data.alarm_konum;
                    } else {
                        alarmKutusu.style.display = 'none';
                    }
                    
                    let aktif = data.aktif;
                    let isikMetin = aktif.isik ? "💡 AÇIK" : "⚫ KAPALI";
                    let suMetin = aktif.su ? "🚰 AKIYOR" : "💧 KAPALI";
                    if(data.alarm) suMetin = "⛔ VALF KESİLDİ";

                    document.getElementById('aktifDurum').innerHTML = 
                        `📍 CANLI KONUM: ${aktif.bina} Binası - Kat ${aktif.kat} | Aydınlatma: ${isikMetin} | Su: ${suMetin}`;

                    let binalarSkor = {};
                    let maxTasarruf = -1;
                    let liderBina = "";

                    for(let bina in data.tuketim) {
                        let hamSuSn = 0; let kurtarilanSuSn = 0; let elkSn = 0;
                        for(let kat in data.tuketim[bina]) {
                            hamSuSn += data.tuketim[bina][kat].su_harcanan_sn;
                            kurtarilanSuSn += data.tuketim[bina][kat].su_kurtarilan_sn;
                            elkSn += data.tuketim[bina][kat].elektrik_sn;
                        }
                        
                        let harcananLitre = (hamSuSn * DEBI_AKILLI);
                        let netTasarrufLitre = (kurtarilanSuSn * DEBI_KLASIK); 
                        let elkTasarruf = (elkSn * ELK_SN);
                        let toplamTasarrufSkoru = netTasarrufLitre + (elkTasarruf * 10);
                        
                        binalarSkor[bina] = {
                            harcananSu: harcananLitre.toFixed(2),
                            kurtarilanSu: netTasarrufLitre.toFixed(2),
                            elkSn: elkSn
                        };
                        
                        if(toplamTasarrufSkoru > maxTasarruf && toplamTasarrufSkoru > 0) {
                            maxTasarruf = toplamTasarrufSkoru;
                            liderBina = bina;
                        }
                    }

                    let gridHTML = "";
                    for(let bina in binalarSkor) {
                        let isLider = (bina === liderBina);
                        let isAktif = (bina === aktif.bina); // Binanın içinde miyiz kontrolü
                        
                        // CSS Class Belirleme
                        let kartSinifi = "card ";
                        if(isLider) kartSinifi += "lig-lider ";
                        if(isAktif) kartSinifi += "aktif-bina ";

                        gridHTML += `
                            <div class="${kartSinifi}">
                                ${isLider ? '<div class="lig-rozet">👑 1.</div>' : ''}
                                ${isAktif ? '<div class="aktif-rozet">📍 BURADASIN</div>' : ''}
                                <h2>${bina}</h2>
                                <p style="color:#e94560">Harcanan Su: <b>${binalarSkor[bina].harcananSu} L</b></p>
                                <p style="color:#00d2ff">Kurtarılan Su: <b>${binalarSkor[bina].kurtarilanSu} L</b></p>
                                <p style="color:#f39c12">Aktif Işık: <b>${binalarSkor[bina].elkSn} sn</b></p>
                            </div>
                        `;
                    }
                    document.getElementById('binaGrid').innerHTML = gridHTML;
                });
        }

        setInterval(veriCek, 1000);

        function gunuBitir() {
            fetch('/api/gun_atla', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    alert(`Gün başarıyla tamamlandı! Sayaçlar sıfırlanarak Gün ${data.yeni_gun} başladı.`);
                    gecmisiGoster();
                });
        }

        function gecmisiGoster() {
            let rapor = "<h2>🌱 Kampüs Çevresel Etki Raporu</h2>";
            
            if(Object.keys(gecmisVeriler).length === 0) {
                rapor += "<p>Kayıt oluşturmak için önce simülasyonda günü bitirin.</p>";
            }

            for(let gun in gecmisVeriler) {
                let veri = gecmisVeriler[gun];
                let gunlukKurtarilanSu = 0;
                let gunlukKurtarilanElk = 0;
                
                for(let bina in veri.tuketim) {
                    for(let kat in veri.tuketim[bina]) {
                        let kSn = veri.tuketim[bina][kat].su_kurtarilan_sn;
                        let eSn = veri.tuketim[bina][kat].elektrik_sn;
                        
                        gunlukKurtarilanSu += (kSn * DEBI_KLASIK);
                        gunlukKurtarilanElk += (eSn * ELK_SN);
                    }
                }

                let agacSayisi = (gunlukKurtarilanSu / 25).toFixed(1);
                let telefonSarji = (gunlukKurtarilanElk / 0.015).toFixed(0);

                rapor += `<div style="background:#1a1a2e; padding:20px; border-radius:10px; margin-bottom:20px; border-left: 5px solid #00d2ff;">
                    <h3 style="color:#e94560; margin-top:0;">📅 ${gun}. GÜN ÖZETİ</h3>
                    <p class="metafor-text">
                        Bugün YALNIZCA "Sabunlama Boşluğu" davranış analizi ile kampüs genelinde <span class="tasarruf-vurgu">${gunlukKurtarilanSu.toFixed(1)} Litre</span> su kurtarıldı.<br>
                        🌳 <i>Bu miktar, yaklaşık <b>${agacSayisi} fidanın</b> haftalık su ihtiyacına eşdeğerdir.</i>
                    </p>
                    <p class="metafor-text">
                        Aydınlatma sensörleriyle <span class="tasarruf-vurgu">${gunlukKurtarilanElk.toFixed(3)} kWh</span> enerji tasarrufu sağlandı.<br>
                        📱 <i>Bu enerji ile <b>${telefonSarji} adet akıllı telefon</b> tam şarj edilebilir.</i>
                    </p>
                    <div style="margin-top:15px; font-weight:bold; color:#ffd700;">Günün Şampiyonu: ${veri.en_tasarruflu} Fakültesi</div>
                </div>`;
            }

            let alan = document.getElementById('raporAlani');
            alan.innerHTML = rapor;
            alan.style.display = 'block';
        }
    </script>
</body>
</html>
